<div class="container mx-auto px-4 py-5 max-w-4xl">
  <!-- Main Card -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg overflow-hidden w-full">
    <!-- Card Header -->
    <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-3">
        <mat-icon class="text-4xl w-8 h-8 text-primary-600 dark:text-primary-400">add_circle</mat-icon>
        <h1 class="text-2xl font-medium text-gray-900 dark:text-white">
          Adicionar Novo Usuário
        </h1>
      </div>
    </div>

    <!-- Card Content -->
    <div class="p-6">
      <form 
        [formGroup]="form" 
        (ngSubmit)="onSubmit()" 
        class="space-y-4"
        role="form"
        aria-label="Formulário de adicionar usuário"
      >
        <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>

        <!-- Form Actions -->
        <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 mt-6 pt-4 border-t border-gray-200 dark:border-gray-700">
          <button
            type="button"
            class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg transition-colors duration-200 w-full sm:w-auto"
            (click)="onCancel()"
            aria-label="Cancelar"
          >
            <mat-icon class="text-xl">cancel</mat-icon>
            Cancelar
          </button>
          <button
            type="submit"
            class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:ring-4 focus:ring-primary-300 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200 w-full sm:w-auto"
            [disabled]="!form.valid"
            aria-label="Salvar usuário"
          >
            <mat-icon class="text-xl">save</mat-icon>
            Salvar Usuário
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
