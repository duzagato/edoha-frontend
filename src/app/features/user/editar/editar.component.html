<div class="max-w-4xl mx-auto">
  <div class="bg-white dark:bg-gray-900 rounded-lg shadow-md border border-gray-200 dark:border-gray-700">
    <!-- Header -->
    <div class="p-6 border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-3">
        <span class="material-icons text-blue-600 dark:text-blue-400">edit</span>
        <h1 class="text-2xl font-medium text-gray-900 dark:text-white">Editar Usuário</h1>
      </div>
    </div>

    <!-- Content -->
    <div class="p-6">
      @if (loading()) {
        <div class="flex flex-col items-center justify-center py-16 gap-4">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 dark:border-blue-400"></div>
          <p class="text-gray-600 dark:text-gray-400">Carregando dados do usuário...</p>
        </div>
      } @else {
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
          <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>

          <div class="flex justify-end gap-3 pt-4">
            <button 
              type="button"
              (click)="onCancel()"
              class="flex items-center gap-2 px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-md hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors"
            >
              <span class="material-icons text-sm">cancel</span>
              <span>Cancelar</span>
            </button>
            <button 
              type="submit"
              [disabled]="!form.valid"
              class="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-800 text-white rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <span class="material-icons text-sm">save</span>
              <span>Salvar Alterações</span>
            </button>
          </div>
        </form>
      }
    </div>
  </div>
</div>

<!-- Toast Notification -->
@if (toastVisible()) {
  <div class="fixed top-4 right-4 z-[1000] max-w-md" role="alert" aria-live="polite">
    <div class="bg-gray-900 dark:bg-gray-800 text-white px-6 py-4 rounded-lg shadow-lg flex items-center gap-3">
      <span class="flex-1">{{ toastMessage() }}</span>
      <button 
        (click)="toastVisible.set(false)"
        class="text-gray-300 hover:text-white transition-colors"
        aria-label="Fechar"
      >
        <span class="material-icons text-sm">close</span>
      </button>
    </div>
  </div>
}
