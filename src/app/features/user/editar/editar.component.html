<div class="editar-container">
  <p-card>
    <ng-template pTemplate="title">
      <div class="header-title">
        <i class="pi pi-pencil"></i>
        <span>Editar Usuário</span>
      </div>
    </ng-template>
    <ng-template pTemplate="content">
      @if (loading()) {
        <div class="loading-container">
          <p-progressspinner />
          <p>Carregando dados do usuário...</p>
        </div>
      } @else {
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="user-form">
          <div class="form-field">
            <label for="name">Nome *</label>
            <input pInputText id="name" formControlName="name" placeholder="Digite o nome completo" class="w-full" />
            @if (form.get('name')?.invalid && form.get('name')?.touched) {
              <small class="error-msg">Nome é obrigatório</small>
            }
          </div>

          <div class="form-field">
            <label for="nickname">Apelido</label>
            <input pInputText id="nickname" formControlName="nickname" placeholder="Digite o apelido" class="w-full" />
          </div>

          <div class="form-field">
            <label for="phone">Telefone</label>
            <input pInputText id="phone" formControlName="phone" placeholder="(00) 00000-0000" class="w-full" />
          </div>

          <div class="form-actions">
            <p-button type="submit" label="Salvar Alterações" icon="pi pi-save" [disabled]="!form.valid" />
          </div>
        </form>
      }
    </ng-template>
  </p-card>
</div>
