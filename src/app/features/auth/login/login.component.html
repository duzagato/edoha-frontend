<div class="full-wrapper flex-center">
  <mat-card class="login-card flex-column bg-1">
    <mat-card-header class="flex-center mat-card-header">
      <mat-card-title class="form-title">
        <img src="/assets/images/logo.png" class="login-card-logo" alt="Edoha Logo" />
        edoha
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form flex-column">
        <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>

        <div class="x-center-wrapper">
          <button
            type="submit"
            class="btn btn-primary font-bold"
            [disabled]="!form.valid"
          >
            <mat-icon>login</mat-icon>
            Entrar
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
