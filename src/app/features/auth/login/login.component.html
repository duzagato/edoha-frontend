<div class="w-full h-full flex items-center justify-center bg-gradient-to-b from-blue-900 to-blue-950 p-4">
  <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 space-y-6">
    <!-- Header with Logo -->
    <div class="flex flex-col items-center justify-center space-y-2">
      <img 
        src="/assets/images/logo.png" 
        class="h-16 w-auto" 
        alt="Edoha Logo"
        role="img"
        aria-label="Edoha Logo"
      />
      <h1 class="text-4xl font-bold text-primary-600 dark:text-primary-400">
        edoha
      </h1>
    </div>

    <!-- Login Form -->
    <form 
      [formGroup]="form" 
      (ngSubmit)="onSubmit()" 
      class="flex flex-col space-y-4"
      role="form"
      aria-label="Formulário de login"
    >
      <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>

      <div class="flex justify-center pt-2">
        <button
          type="submit"
          class="inline-flex items-center justify-center gap-2 px-6 py-2.5 text-white bg-secondary-500 hover:bg-secondary-600 focus:ring-4 focus:ring-secondary-300 font-bold rounded-3xl disabled:opacity-75 disabled:cursor-not-allowed transition-colors duration-200 min-w-[180px] sm:min-w-[240px]"
          [disabled]="!form.valid"
          aria-label="Entrar no sistema"
        >
          <mat-icon>login</mat-icon>
          Entrar
        </button>
      </div>
    </form>
  </div>
</div>
