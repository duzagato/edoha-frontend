<div class="flex min-h-screen w-full items-center justify-center bg-background p-4 bg-blue-400">
  
  <!-- Toast Notification -->
  @if (showToast()) {
    <div class="fixed bottom-4 justify-center items-center z-50 animate-slide-in">
      <div 
        [class]="toastType() === 'success' 
          ? 'bg-accent text-accent-foreground' 
          : 'bg-red-800'"
        class="flex items-center justify-center gap-3 px-6 py-4 rounded-lg shadow-lg min-w-[200px] text-center">
        @if (toastType() === 'success') {
          <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        }
        <span class="font-medium">{{ toastMessage() }}</span>
      </div>
    </div>
  }

  <div class="w-full max-w-md rounded-2xl bg-card p-8 shadow-xl flex flex-col gap-6 bg-gray-900">
    
    <header class="flex flex-col items-center justify-center gap-2">
      <div class="flex items-center justify-center gap-3">
        <img src="/assets/images/logo.png" class="h-12 w-auto object-contain" alt="Edoha Logo" />
        <span class="text-3xl tracking-tight text-foreground flex items-center justify-center">
          edoha
        </span>
      </div>
      <p class="text-sm text-muted-foreground">Faça login para acessar o painel</p>
    </header>

    <main>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        
        <div class="formly-container">
          <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>
        </div>

        <div class="mt-4 flex justify-center">
          <button
            type="submit"
            [disabled]="!form.valid"
            class="group flex w-full items-center justify-center gap-2 rounded-lg bg-primary px-6 py-3 text-primary-foreground font-bold transition-all 
                   hover:opacity-90 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100 shadow-lg"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            Entrar
          </button>
        </div>
      </form>
    </main>

  </div>
</div>
