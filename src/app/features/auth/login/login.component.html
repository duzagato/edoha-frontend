<p-toast position="top-center"></p-toast>

<div class="login-wrapper">
  <p-card styleClass="login-card">
    <ng-template pTemplate="header">
      <div class="login-header">
        <img src="/assets/images/logo.png" class="login-logo" alt="Edoha Logo" />
        <span class="login-title">edoha</span>
      </div>
    </ng-template>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <p-float-label variant="on">
        <input
          pInputText
          id="nickname"
          name="nickname"
          [(ngModel)]="model.nickname"
          required
          class="w-full"
        />
        <label for="nickname">Apelido</label>
      </p-float-label>

      <p-float-label variant="on">
        <p-password
          inputId="password"
          name="password"
          [(ngModel)]="model.password"
          [feedback]="false"
          [toggleMask]="true"
          required
          styleClass="w-full"
          inputStyleClass="w-full"
        ></p-password>
        <label for="password">Senha</label>
      </p-float-label>

      <p-button
        type="submit"
        label="Entrar"
        icon="pi pi-sign-in"
        [disabled]="loginForm.invalid"
        styleClass="w-full"
      ></p-button>
    </form>
  </p-card>
</div>
