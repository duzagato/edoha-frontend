<div class="adicionar-container">
  <mat-card class="adicionar-card">
    <mat-card-header>
      <mat-card-title>
        <div class="header-title">
          <mat-icon>add_circle</mat-icon>
          <span>Adicionar Nova Rifa</span>
        </div>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="lottery-form">
        <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>

        <div class="form-actions">
          <button type="button" mat-stroked-button (click)="onCancel()">
            <mat-icon>cancel</mat-icon>
            Cancelar
          </button>
          <button type="submit" mat-raised-button color="primary" [disabled]="!form.valid">
            <mat-icon>save</mat-icon>
            Salvar Rifa
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
