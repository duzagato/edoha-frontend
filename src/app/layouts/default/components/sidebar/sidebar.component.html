<div class="h-full bg-white dark:bg-gray-800">
  <mat-accordion multi class="shadow-none">
    @for (item of menuItems(); track item.title) {
      @if (item.children) {
        <!-- Expandable Menu Item -->
        <mat-expansion-panel class="!shadow-none !rounded-none bg-white dark:bg-gray-800">
          <mat-expansion-panel-header class="!h-14 !px-4 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
            <mat-panel-title class="flex items-center">
              <mat-icon class="mr-3 text-gray-700 dark:text-gray-300">{{ item.icon }}</mat-icon>
              <span class="font-medium text-gray-900 dark:text-white">{{ item.title }}</span>
            </mat-panel-title>
          </mat-expansion-panel-header>

          <mat-nav-list class="!p-0">
            @for (child of item.children; track child.title) {
              <a
                mat-list-item
                [routerLink]="child.route"
                routerLinkActive="!bg-primary-100 dark:!bg-primary-900 !text-primary-700 dark:!text-primary-300"
                [routerLinkActiveOptions]="{exact: false}"
                class="!h-14 !pl-12 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
                role="menuitem"
              >
                <mat-icon matListItemIcon class="!mr-2 text-gray-600 dark:text-gray-400">{{ child.icon }}</mat-icon>
                <span matListItemTitle class="text-gray-800 dark:text-gray-200">{{ child.title }}</span>
              </a>
            }
          </mat-nav-list>
        </mat-expansion-panel>
      } @else {
        <!-- Single Menu Item -->
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="!bg-primary-100 dark:!bg-primary-900 !text-primary-700 dark:!text-primary-300"
          [routerLinkActiveOptions]="{exact: true}"
          class="!h-14 !px-4 flex items-center hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors no-underline"
          role="menuitem"
        >
          <mat-icon matListItemIcon class="!mr-3 text-gray-700 dark:text-gray-300">{{ item.icon }}</mat-icon>
          <span matListItemTitle class="font-medium text-gray-900 dark:text-white">{{ item.title }}</span>
        </a>
      }
    }
  </mat-accordion>
</div>
