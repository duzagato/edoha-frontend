<nav class="sidebar bg-card border-r border-border h-full overflow-y-auto">
  <div class="py-4">
    @for (item of menuItems(); track item.title) {
      @if (item.children) {
        <!-- Menu item with children (expandable) -->
        <div class="border-b border-border">
          <button
            (click)="toggleMenuItem(item)"
            class="flex w-full items-center justify-between px-4 py-3 text-card-foreground hover:bg-muted transition-colors"
          >
            <div class="flex items-center gap-3">
              <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" [innerHTML]="getIconSvg(item.icon)"></svg>
              <span class="font-medium">{{ item.title }}</span>
            </div>
            <svg
              class="h-4 w-4 transition-transform"
              [class.rotate-90]="item.expanded"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>

          <!-- Submenu -->
          @if (item.expanded) {
            <div class="bg-muted/30">
              @for (child of item.children; track child.title) {
                <a
                  [routerLink]="child.route"
                  routerLinkActive="bg-primary text-primary-foreground"
                  [routerLinkActiveOptions]="{exact: false}"
                  class="flex items-center gap-3 px-4 py-2.5 pl-12 text-sm text-card-foreground hover:bg-muted transition-colors"
                >
                  <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" [innerHTML]="getIconSvg(child.icon)"></svg>
                  <span>{{ child.title }}</span>
                </a>
              }
            </div>
          }
        </div>
      } @else {
        <!-- Simple menu item (no children) -->
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-primary text-primary-foreground"
          [routerLinkActiveOptions]="{exact: true}"
          class="flex items-center gap-3 px-4 py-3 text-card-foreground hover:bg-muted transition-colors border-b border-border"
        >
          <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" [innerHTML]="getIconSvg(item.icon)"></svg>
          <span class="font-medium">{{ item.title }}</span>
        </a>
      }
    }
  </div>
</nav>
