<header class="sticky top-0 z-50 w-full bg-primary text-primary-foreground shadow-md">
  <div class="flex h-16 items-center px-4 gap-4">
    
    <!-- Menu toggle button for mobile -->
    <button 
      (click)="onMenuToggle()" 
      class="md:hidden inline-flex items-center justify-center rounded-md p-2 hover:bg-primary/90 transition-colors"
      aria-label="Toggle menu"
    >
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Logo and app title -->
    <div class="flex items-center gap-3">
      <img src="assets/images/logo.png" alt="Edoha Logo" class="h-10 w-auto" />
      <span class="text-2xl font-medium tracking-wide">edoha</span>
    </div>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- Theme toggle button -->
    <button 
      (click)="toggleTheme()" 
      class="inline-flex items-center justify-center rounded-md p-2 hover:bg-primary/90 transition-colors"
      [title]="themeService.currentTheme() === 'light' ? 'Ativar modo escuro' : 'Ativar modo claro'"
      aria-label="Toggle theme"
    >
      @if (themeService.currentTheme() === 'light') {
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      } @else {
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      }
    </button>

    <!-- User menu -->
    <div class="relative">
      <button 
        (click)="toggleUserMenu()" 
        class="flex items-center gap-2 rounded-md px-3 py-2 hover:bg-primary/90 transition-colors"
        aria-label="User menu"
      >
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="hidden sm:inline-block text-sm font-medium">{{ userName }}</span>
        <svg 
          class="h-4 w-4 transition-transform"
          [class.rotate-180]="userMenuOpen()"
          fill="none" 
          viewBox="0 0 24 24" 
          stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown menu -->
      @if (userMenuOpen()) {
        <div class="absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-card border border-border overflow-hidden z-50">
          <div class="py-1">
            <button 
              (click)="navigateToSettings()"
              class="flex w-full items-center gap-3 px-4 py-2 text-sm text-card-foreground hover:bg-muted transition-colors"
            >
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span>Configurações</span>
            </button>
            <button 
              (click)="logout()"
              class="flex w-full items-center gap-3 px-4 py-2 text-sm text-destructive hover:bg-muted transition-colors"
            >
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              <span>Sair</span>
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</header>

<!-- Overlay to close menu when clicking outside -->
@if (userMenuOpen()) {
  <div 
    class="fixed inset-0 z-40" 
    (click)="closeUserMenu()"
  ></div>
}
