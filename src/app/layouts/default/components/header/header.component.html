<mat-toolbar color="primary" class="header">
  <button mat-icon-button (click)="onMenuToggle()" class="menu-toggle">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="logo-container">
    <img src="assets/images/logo.png" alt="Edoha Logo" class="logo" />
    <span class="app-title">edoha</span>
  </div>

  <span class="spacer"></span>

  <button mat-icon-button (click)="toggleTheme()" class="theme-toggle" title="Toggle theme">
    @if (themeService.currentTheme() === 'light') {
      <mat-icon>dark_mode</mat-icon>
    } @else {
      <mat-icon>light_mode</mat-icon>
    }
  </button>

  <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">
    <mat-icon>account_circle</mat-icon>
    <span class="user-name">{{ userName }}</span>
    <mat-icon>arrow_drop_down</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <button mat-menu-item (click)="navigateToSettings()">
      <mat-icon>settings</mat-icon>
      <span>Configurações</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sair</span>
    </button>
  </mat-menu>
</mat-toolbar>
