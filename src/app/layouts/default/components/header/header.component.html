<header class="sticky top-0 z-[1000] bg-blue-600 dark:bg-blue-800 text-white shadow-md">
  <div class="flex items-center h-16 px-4">
    <!-- Menu Toggle Button (Mobile) -->
    <button 
      (click)="onMenuToggle()" 
      class="lg:hidden p-2 rounded-md hover:bg-blue-700 dark:hover:bg-blue-900 transition-colors"
      aria-label="Toggle menu"
    >
      <span class="material-icons">menu</span>
    </button>

    <!-- Logo Container -->
    <div class="flex items-center gap-3">
      <img src="assets/images/logo.png" alt="Edoha Logo" class="h-10 w-auto" />
      <span class="text-2xl font-medium tracking-wide">edoha</span>
    </div>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- Theme Toggle Button -->
    <button 
      (click)="toggleTheme()" 
      class="p-2 mr-2 rounded-md hover:bg-blue-700 dark:hover:bg-blue-900 transition-colors"
      title="Toggle theme"
      aria-label="Toggle theme"
    >
      @if (themeService.currentTheme() === 'light') {
        <span class="material-icons">dark_mode</span>
      } @else {
        <span class="material-icons">light_mode</span>
      }
    </button>

    <!-- User Menu -->
    <div class="relative">
      <button 
        (click)="toggleUserMenu()"
        class="flex items-center gap-2 px-3 py-2 rounded-md hover:bg-blue-700 dark:hover:bg-blue-900 transition-colors"
        aria-label="User menu"
      >
        <span class="material-icons">account_circle</span>
        <span class="hidden sm:inline">{{ userName }}</span>
        <span class="material-icons text-lg">arrow_drop_down</span>
      </button>

      <!-- Dropdown Menu -->
      @if (isUserMenuOpen()) {
        <div 
          role="menu"
          class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg py-1 z-[1001]"
          (click)="closeUserMenu()"
        >
          <button 
            role="menuitem"
            (click)="navigateToSettings()"
            class="flex items-center gap-3 w-full px-4 py-2 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          >
            <span class="material-icons text-base">settings</span>
            <span>Configurações</span>
          </button>
          <button 
            role="menuitem"
            (click)="logout()"
            class="flex items-center gap-3 w-full px-4 py-2 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          >
            <span class="material-icons text-base">logout</span>
            <span>Sair</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>

<!-- Overlay for closing menu when clicking outside -->
@if (isUserMenuOpen()) {
  <div 
    class="fixed inset-0 z-[1000]" 
    (click)="closeUserMenu()"
  ></div>
}
