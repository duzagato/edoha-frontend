<header class="header">
  <p-button
    icon="pi pi-bars"
    [text]="true"
    [rounded]="true"
    (onClick)="onMenuToggle()"
    class="menu-toggle"
  />

  <div class="logo-container">
    <img src="assets/images/logo.png" alt="Edoha Logo" class="logo" />
    <span class="app-title">edoha</span>
  </div>

  <span class="spacer"></span>

  <p-button
    [icon]="themeService.currentTheme() === 'light' ? 'pi pi-moon' : 'pi pi-sun'"
    [text]="true"
    [rounded]="true"
    (onClick)="toggleTheme()"
    title="Toggle theme"
    class="theme-toggle"
  />

  <p-menu #menu [model]="userMenuItems" [popup]="true" />
  <p-button
    [label]="userName"
    icon="pi pi-user"
    iconPos="left"
    [text]="true"
    (onClick)="menu.toggle($event)"
    class="user-menu-trigger"
  />
</header>
