<nav class="sticky top-0 z-50 bg-primary-600 dark:bg-primary-700 shadow-lg">
  <div class="flex items-center justify-between px-4 py-3">
    <!-- Menu Toggle Button (Mobile) -->
    <button
      type="button"
      class="inline-flex items-center p-2 text-white rounded-lg hover:bg-primary-700 dark:hover:bg-primary-800 focus:outline-none focus:ring-2 focus:ring-primary-300 lg:hidden"
      (click)="onMenuToggle()"
      aria-label="Abrir menu"
    >
      <mat-icon>menu</mat-icon>
    </button>

    <!-- Logo and App Title -->
    <div class="flex items-center gap-3">
      <img
        src="assets/images/logo.png"
        alt="Edoha Logo"
        class="h-10 w-auto"
        role="img"
      />
      <span class="text-2xl font-medium text-white tracking-wide">
        edoha
      </span>
    </div>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- Right Side Actions -->
    <div class="flex items-center gap-2">
      <!-- Theme Toggle Button -->
      <button
        type="button"
        class="inline-flex items-center p-2 text-white rounded-lg hover:bg-primary-700 dark:hover:bg-primary-800 focus:outline-none focus:ring-2 focus:ring-primary-300"
        (click)="toggleTheme()"
        title="Alternar tema"
        aria-label="Alternar tema"
      >
        @if (themeService.currentTheme() === 'light') {
          <mat-icon>dark_mode</mat-icon>
        } @else {
          <mat-icon>light_mode</mat-icon>
        }
      </button>

      <!-- User Menu Button -->
      <button
        type="button"
        class="inline-flex items-center gap-2 px-3 py-2 text-white rounded-lg hover:bg-primary-700 dark:hover:bg-primary-800 focus:outline-none focus:ring-2 focus:ring-primary-300"
        [matMenuTriggerFor]="userMenu"
        aria-label="Menu do usuário"
      >
        <mat-icon>account_circle</mat-icon>
        <span class="hidden sm:inline-block">{{ userName }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <!-- User Dropdown Menu -->
      <mat-menu #userMenu="matMenu" xPosition="before">
        <button mat-menu-item (click)="navigateToSettings()">
          <mat-icon>settings</mat-icon>
          <span>Configurações</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </mat-menu>
    </div>
  </div>
</nav>
