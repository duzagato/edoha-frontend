<p-toast />
<div class="default-layout">
  <app-header (menuToggle)="toggleDrawer()"></app-header>

  <div class="layout-body">
    <aside class="sidebar" [class.sidebar-open]="sidebarOpen()" [class.sidebar-overlay]="isHandset()">
      <app-sidebar></app-sidebar>
    </aside>

    @if (isHandset() && sidebarOpen()) {
      <div class="sidebar-backdrop" (click)="toggleDrawer()"></div>
    }

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
