<div class="flex flex-col h-screen">
  <app-header (menuToggle)="toggleDrawer()"></app-header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside 
      class="w-70 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 transition-transform duration-300 ease-in-out"
      [class.hidden]="isHandset() && !isSidebarOpen()"
      [class.lg:block]="!isHandset()"
    >
      <app-sidebar></app-sidebar>
    </aside>

    <!-- Overlay for mobile -->
    @if (isHandset() && isSidebarOpen()) {
      <div 
        class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
        (click)="toggleDrawer()"
      ></div>
    }

    <!-- Mobile sidebar -->
    @if (isHandset()) {
      <aside 
        class="fixed inset-y-0 left-0 w-70 bg-white dark:bg-gray-900 shadow-xl z-50 transition-transform duration-300 ease-in-out transform lg:hidden"
        [class.-translate-x-full]="!isSidebarOpen()"
        [class.translate-x-0]="isSidebarOpen()"
      >
        <app-sidebar></app-sidebar>
      </aside>
    }

    <!-- Main Content -->
    <main class="flex-1 overflow-auto bg-gray-100 dark:bg-gray-800 p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
