<div class="full-wrapper flex-center">
  <mat-card class="login-card flex-column bg-1">
    <mat-card-header class="flex-center mat-card-header">
      <mat-card-title class="form-title">Edoha</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit(model)" class="login-form flex-column">
        <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>

        <button mat-flat-button color="primary" type="submit" class="font-bold btn-1" [disabled]="!form.valid">
          <mat-icon>login</mat-icon>
          Entrar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
