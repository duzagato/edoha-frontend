name: 'Develop → Release'

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-branch:
    if: |
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'feature/') ||
       startsWith(github.event.pull_request.head.ref, 'fix/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Status do Merge
        run: |
          echo "## ✅ Merge para develop concluído com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch mergeada:** \`${{ github.event.pull_request.head.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY

      - name: Determinar tipo de versão
        id: version-type
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ $BRANCH == feature/* ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "type=feature" >> $GITHUB_OUTPUT
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "type=fix" >> $GITHUB_OUTPUT
          fi

      - name: Obter versão atual e calcular nova versão
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          if [ "${{ steps.version-type.outputs.bump }}" == "minor" ]; then
            NEW_VERSION="$major.$((minor + 1)).0"
          else
            NEW_VERSION="$major.$minor.$((patch + 1))"
          fi

          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versão atual: $CURRENT_VERSION → Nova versão: $NEW_VERSION" >> $GITHUB_STEP_SUMMARY

      - name: Criar branch release
        id: create-branch
        run: |
          RELEASE_BRANCH="release/v${{ steps.version.outputs.new }}"
          git checkout -b "$RELEASE_BRANCH"

          # Atualizar package.json com nova versão
          npm version ${{ steps.version.outputs.new }} --no-git-tag-version

          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new }}"
          git push origin "$RELEASE_BRANCH"

          echo "branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT

      - name: Criar PR para release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_BRANCH="${{ steps.create-branch.outputs.branch }}"
          PR_TITLE="PR Gerada Automaticamente: develop -> $RELEASE_BRANCH"

          PR_BODY="## 🚀 Release v${{ steps.version.outputs.new }}

          Esta PR foi criada automaticamente após merge para \`develop\`.

          **Tipo de release:** \`${{ steps.version-type.outputs.type }}\`
          **Versão anterior:** \`${{ steps.version.outputs.current }}\`
          **Nova versão:** \`${{ steps.version.outputs.new }}\`

          ---

          ### 📋 Mudanças incluídas

          - Branch mergeada: \`${{ github.event.pull_request.head.ref }}\`
          - PR de origem: #${{ github.event.pull_request.number }}

          ---

          ### ✅ Checklist antes do merge

          - [ ] Versão atualizada no package.json
          - [ ] Testes passando
          - [ ] Código revisado
          - [ ] Pronto para produção
          "

          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base develop \
            --head "$RELEASE_BRANCH" \
            --label "release"
